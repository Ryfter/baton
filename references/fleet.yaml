# Fleet registry — which providers the orchestrator can dispatch to.
# Lean by design: only what's needed to INVOKE a provider lives here.
# Qualitative "which model for what" notes live in
# ~/.claude/knowledge/universal/routing.md and evolve via /consolidate-routing.
#
# Fields:
#   name              unique key, [a-z0-9-]+, used as /fleet test <name>
#   kind              cli | http | stdio-json
#   enabled           true | false (disabled providers are skipped, not invoked)
#   cost_tier         paid | free | local
#   command_template  (cli / stdio-json) cli: {{prompt}} required, {{model}} optional.
#                     Third transport: {{prompt_file}} = the prompt is written to a
#                     temp file and its path substituted (quote-safe + size-safe) —
#                     for CLIs that neither read stdin nor tolerate inline quotes (grok).
#                     stdio-json: executable that speaks one JSON request on stdin /
#                     one JSON response on stdout (request always via temp file first).
#   stdin             (cli only, optional) true = template has no {{prompt}}; the
#                     prompt is piped via stdin (quote-safe). false = explicit VETO
#                     of the automatic clean-tail stdin promotion for CLIs that do
#                     not read stdin (e.g. agy). Absent = promotion applies when the
#                     template's tail is a standalone quoted {{prompt}}.
#   model_default     (optional) fallback when --model not given
#   env               (optional) env vars set before invoking, restored after
#   base_url          (http) OpenAI-compatible server root; generic Invoke-FleetHttpChat
#                     POSTs to {base_url}{endpoint}. Optional hatch scripts/fleet/<name>.ps1
#                     still overrides the generic path when present (escape valve).
#   endpoint          (http, optional) path under base_url; default /v1/chat/completions
#   api_key_env       (http, optional) NAME of the environment variable holding the
#                     credential — never the credential itself. The key is read at
#                     dispatch and sent as `Authorization: Bearer <key>`. A row that
#                     declares this but whose variable is unset FAILS LOUDLY before
#                     any network call (an anonymous request against a paid endpoint
#                     is a useless 401; against a permissive one it bills the wrong
#                     account). The value is scrubbed out of any journaled stderr.
#   auth_header       (http, optional) header name for the credential; default
#                     'Authorization'. Set 'x-api-key' for that dialect.
#   auth_prefix       (http, optional) string prepended to the credential; default
#                     'Bearer '. An explicitly empty value sends the raw key.
#   headers           (http, optional) nested map of static request headers, e.g.
#                     OpenRouter's HTTP-Referer / X-Title attribution pair.
#   role              (optional) draft | bulk | finisher — cascade stage (Slice B).
#                     Absent -> inferred: local/free = draft, paid = finisher.
#   adapter           (optional) names the worker-adapter that meters this provider
#                     and maps its rate-limit responses to Usage-Governor states
#                     (auto-tick + auto-lockout). Absent = unmetered. v1: github-models.
#   saturate          (optional) true | false — opt into the active saturation driver:
#                     when this worker has a budget and is under-utilized, routing
#                     up-ranks it (economy mode) to spend its pre-paid allotment first.
#                     Default false. BOX-PRIVATE: set a real `saturate: true` (and the
#                     budget) only in your live ~/.baton/fleet.yaml.
#   saturation_target (optional, float) utilization % the driver pushes toward before it
#                     stops boosting. Default 99.9.
#   platform          (optional) claude | codex | gemini | grok | github | local — Lever 4
#                     identity; journaled now, consumed by the cost/speed advisor later.
#   timeout_s         (http / stdio-json, optional) per-request timeout seconds; default 300
#   max_prompt_bytes  (optional) UTF-8 byte ceiling enforced pre-dispatch; oversize ->
#                     loud prompt_too_large skip (no process/network call). Absent = no check.
#   probe             (optional) declaration slot for usage-probe adapters
#                     (e.g. codex-app-server). Wiring is Layer 2; this field is the home.
#   capabilities      (optional) explicit capability claims — a provider WITH this
#                     list is a candidate for ONLY those capabilities; without it,
#                     the blanket general_capabilities grant applies (frontier CLIs).
#                     Canonical taxonomy (matches Gauntlet battery names):
#                     code-gen, code-transform, commit-msg, extract-json,
#                     summarize-short, summarize-long, synthesize, write-personal,
#                     write-scientific, write-formal, ocr, embed, judge, reasoning,
#                     vision, triage, classify, review, plan-review
#   triage / classify  — structured task classification (issue → type/priority/risk)
#   review            — competitive acceptance review: emit JSON findings
#                       (severity/area/summary) for the Acceptance/Polish Gate
#   plan-review       — competitive PLAN once-over (Plan Gate, d080): critique a
#                       conductor plan.json BEFORE labor runs; emit JSON findings
#                       (severity/area/summary). Separate from post-work `review` so
#                       acceptance reviewers are not auto-drafted as plan peers.
#   budget            (optional, int) usage budget per reset window — read by the
#                     Usage Governor forecast (days-to-exhaustion). BOX-PRIVATE: set
#                     real values only in your live ~/.baton/fleet.yaml, never here.
#   context           (optional) loaded context of the pinned profile (tokens);
#                     claims below a capability_floors entry are filtered out
#   usage_class       (optional) tight (small specialist, fine while Kevin is active)
#                     | broad (15GB+ generalist, idle-gated in a later slice)
#   agentic           (optional) true | false — edit-eligibility for /baton:go --execute
#                     (agentic labor into a run worktree). Authoritative when present;
#                     absent -> inferred from platform ∈ {claude, codex, gemini}.
#                     d091: kind http|stdio-json can NEVER be agentic (no file-edit
#                     harness); an explicit agentic:true is refused at the executor seam.
#                     Non-agentic providers are filtered out of edit tasks (their
#                     diff-apply path arrives in Slice 3).
#   usage_policy      (optional, box-private nested block) pre-flight usage buffer.
#                     Absent = no proactive probe and fully backward-compatible.
#                     `probe: true` is meaningful only where Baton ships an adapter.
#                     Defaults inside a present block: probe false, soft_cap_5h 75,
#                     soft_cap_weekly 85, soft_cap_credit 85. soft_cap_credit is
#                     percent of a PREPAID key's credit limit spent (scope
#                     paid_credit) — a depleting balance, not a rolling window;
#                     pair it with a vendor-side limit on the key itself.
#                     monthly_allowance is user-entered; find it
#                     at GitHub -> avatar (top-right) -> Copilot Settings -> usage,
#                     shown as consumed / allowance. Never commit real values here.
#                     probe_transport/probe_provider/probe_command/scope_id select
#                     and address the probe adapter. See docs/usage-probes.md.
#
# VRAM rule (d043): run ONE model-serving process per box — e.g. never enable
# ollama AND lm-studio on the same machine; they cannot see each other's VRAM
# use and concurrent big loads spill to system RAM. PIN explicit model names
# ('auto' = unpinned = the server's first listed model, rarely what you want).
# To split big/small roles, add multiple entries against the SAME server.

# Default roster for /research and /ensemble when no --providers/--tier given.
research_default: [claude-cli, codex, ollama-local]
# Broad capabilities served by the general (conversational) models below.
# The router treats every ENABLED provider as a candidate for these.
general_capabilities: [code-gen, reasoning, summarize]

# Min context (tokens) a provider must declare to claim a capability.
capability_floors:
  summarize-long: 65536
  judge: 4096

# Personal/keep models (globs): inventory tags them, recommendations never
# propose culling them, the router can never claim them (they're unregistered).
keep_list: ['*heretic*']

# learned_routing (optional, top-level) — BOX-PRIVATE, default OFF. When set true in
# your live ~/.baton/fleet.yaml, Select-Capability biases its ECONOMY ranking by each
# worker's LEARNED effective cost (slice 3, d060): a worker that has cost more per unit
# quality (Acceptance-Gate verdicts ÷ spend, folded from $BATON_HOME/runs) yields toward
# the next cost tier; a learned-cheap worker reaches toward the tier below. Bounded to an
# adjacent-tier shift, confidence-gated (only trusted rows move routing), saturation-
# floored. Champion mode ignores it. Off / absent => routing is byte-for-byte unchanged.
# learned_routing: true   # set ONLY in your live box file, never in this shared seed.

providers:
  - name: claude-cli
    kind: cli
    enabled: true
    cost_tier: paid
    role: finisher
    platform: claude
    command_template: 'claude -p "{{prompt}}"'

  # --sandbox workspace-write: codex downgrades untrusted dirs (e.g. Baton's
  # throwaway run worktrees) to a READ-ONLY sandbox and, with approval never,
  # exits 0 having edited nothing — a silent no-op for /baton:go --execute.
  # The explicit policy scopes writes to the cwd, which IS the worktree.
  # capabilities: explicit list REPLACES the blanket general_capabilities grant, so
  # the general trio is restated alongside the Plan Gate grants (d080: codex is a
  # default plan-review peer — do not rely on the blanket grant for that roster).
  - name: codex
    kind: cli
    enabled: true
    cost_tier: paid
    role: finisher
    platform: codex
    command_template: 'codex exec --sandbox workspace-write {{tier_args}} "{{prompt}}"'
    # Per-model token capture (observe-only). ONE capture group over stdout; commas
    # stripped. No match -> honest len/4 estimate (never labelled exact).
    token_usage: 'tokens used[:\s]+([\d,]+)'
    # Layer 2 (d090) is opt-in per box. Copy/uncomment this block only in the live
    # ~/.baton/fleet.yaml. These are policy defaults/placeholders, not vendor quota.
    # usage_policy:
    #   probe: false
    #   soft_cap_5h: 75
    #   soft_cap_weekly: 85
    #   monthly_allowance: <enter allowance>
    #   probe_transport: <transport name, see docs/usage-probes.md>
    #   probe_provider: <the probe tool's own name for this account>
    #   probe_command: <optional explicit path to the probe binary>
    #   scope_id: <optional model-scoped window id to bind this row to>
    # Named tiers: --tier <name> substitutes the fragment at {{tier_args}}; --tier all
    # runs every tier (boundary tester). Real model IDs are BOX-PRIVATE — add
    # `tier_<name>: '-m <model-id> ...'` rows in your live ~/.baton/fleet.yaml.
    # These effort-only examples are generic codex flags:
    tier_low:  '-c model_reasoning_effort=low'
    tier_med:  '-c model_reasoning_effort=medium'
    tier_high: '-c model_reasoning_effort=high'
    capabilities: [code-gen, reasoning, summarize, plan-review, review]

  # agy does NOT read stdin: the clean-tail stdin promotion would turn this into a
  # bare `agy --print` ("flag needs an argument"), and `agy --print -` treats the
  # dash as an empty prompt (exit 0, generic greeting — a silent no-op). stdin: false
  # vetoes the promotion; the prompt interpolates inline. CAVEAT: inline breaks on
  # embedded double quotes, so route agy quote-free labor prompts, not JSON-schema
  # prompts (e.g. planning).
  - name: gemini-antigravity
    kind: cli
    enabled: true
    cost_tier: paid
    role: finisher
    platform: gemini
    stdin: false
    command_template: 'agy --print "{{prompt}}"'

  # grok (xAI CLI) — DISABLED 2026-08-22. NOT headlessly dispatchable. See #183/#196/#197.
  #
  # The template below is preserved as a record of what does NOT work. Bare `grok` is
  # the interactive TUI; `grok --prompt-file <path>` never returns — it hangs with zero
  # bytes of output until the caller gives up (one observed hang ran 3,955s, #196). The
  # 2026-07-10 "proven quote-safe live" note above was a false positive: the probe read
  # a `head` exit code, not grok's.
  #
  # The real headless entry point is `grok agent stdio`, which speaks ACP (JSON-RPC 2.0
  # over NDJSON) — a different protocol from Baton's `stdio-json`. `initialize` and
  # `authenticate` both succeed; `session/new` never returns (#197). A command_template
  # swap therefore cannot fix this; it needs an ACP adapter.
  #
  # Until that adapter exists grok is an INTERACTIVE instrument — plan peer, reviewer,
  # second opinion in a terminal pane — and must never be reachable from a dispatch path
  # that expects file edits. `agentic: true` is commented out for the same reason: it
  # claimed a capability grok cannot deliver headlessly, which is a silent-no-op risk in
  # `/baton:go --execute` (#183).
  - name: grok-cli
    kind: cli
    enabled: false
    cost_tier: paid
    role: finisher
    platform: grok
    # agentic: true          # DO NOT re-enable before #197 — see note above
    command_template: 'grok --prompt-file "{{prompt_file}}"'   # hangs; kept as a record
    capabilities: [reasoning, plan-review, review]

  # gh-copilot — DISABLED 2026-08-22. The command it names no longer exists. See #188.
  #
  # `gh copilot suggest` was a `gh` extension, retired October 2025. It also was never
  # a coding agent: it printed a suggested shell command, so this row could not have
  # done bulk labor even while the extension lived.
  #
  # Four different GitHub binaries get collapsed into this one row. They are not
  # interchangeable:
  #   gh          GitHub CLI. A TOOL every pane should shell out to (PRs, issues,
  #               `gh api`, auth). Never a providers: row.
  #   copilot     The Copilot coding AGENT (`@github/copilot`). Headless `copilot -p`.
  #               Speaks ACP. This is the one that could be a fleet worker.
  #   gh copilot  RETIRED extension (suggest/explain). What this row names. Dead.
  #   gh models   `gh models run` — cheap text inference. Not an agent, not Copilot.
  #               Modelled separately as the `github-models` row.
  #
  # Promoting `copilot` to a real agentic row is #188, and is gated on #209 (Copilot
  # auto-loads `.github/copilot-instructions.md`, which this repo does not have, so a
  # Copilot session starts with none of the shared law). When that row lands it wants
  # `copilot -p "{{prompt}}" -s --no-ask-user` with a tight `--allow-tool=…` — never
  # `--allow-all`.
  #
  # The row NAME is kept as-is on purpose: `scripts/copilot-credit-lib.ps1` and
  # `scripts/fleet-usage.ps1` default to the worker string 'gh-copilot' for the d079
  # credit panel. Renaming is part of #188, not a seed-only edit.
  - name: gh-copilot
    kind: cli
    enabled: false
    cost_tier: paid
    role: bulk
    platform: github
    command_template: 'gh copilot suggest "{{prompt}}"'   # retired Oct 2025; do not invoke
    # Copilot credit budget (d079) — BOX-PRIVATE: set real values ONLY in your live
    # ~/.baton/fleet.yaml. The allowance/reset-day are per-account.
    # budget: 1500            # monthly Copilot AI-credit allowance (credits; 1 = $0.01)
    # credit_reset_day: 10    # billing-cycle reset day-of-month (1-28)
    # credit_warn_pct: 80     # optional warn threshold (default 80)

  # ── Triage workers (Sprint 1): explicit model pins for the triage role. ──
  # stdin: true so the JSON-schema-heavy triage prompt is piped, never
  # interpolated through Invoke-Expression (which would mangle quotes/braces).
  # The real competitive reviewer pair (e.g. Codex + Opus) is BOX-PRIVATE — set it
  # in your live ~/.baton/fleet.yaml; these seed grants are an example pool only.
  - name: claude-haiku
    kind: cli
    enabled: true
    cost_tier: paid
    stdin: true
    capabilities: [triage, classify, research, summarize-short, review]
    model_default: 'claude-haiku-4-5-20251001'
    command_template: 'claude -p --model claude-haiku-4-5-20251001'

  - name: claude-sonnet
    kind: cli
    enabled: true
    cost_tier: paid
    stdin: true
    capabilities: [triage, research, code-gen, reasoning, summarize, review]
    model_default: 'claude-sonnet-4-6'
    command_template: 'claude -p --model claude-sonnet-4-6'
    # budget: 0   # example only — set a real per-window budget in live ~/.baton/fleet.yaml

  - name: opencode
    kind: cli
    enabled: false
    cost_tier: free
    role: draft
    command_template: 'opencode -p "{{prompt}}"'

  - name: ollama-local
    kind: cli
    enabled: true
    cost_tier: local
    role: draft
    platform: local
    model_default: 'devstral:24b'
    command_template: 'ollama run {{model}} "{{prompt}}"'

  # Remote Ollama box over Tailscale (Plan 9 / issue #20). Uses Ollama's
  # OpenAI-compatible /v1/chat/completions endpoint via fleet-lib's generic HTTP
  # transport — the local `ollama run` CLI hangs against a remote host. Replace
  # the documentation-only address in each box's deployed fleet.yaml.
  - name: ollama-box2
    kind: http
    enabled: true
    cost_tier: local
    role: draft
    platform: local
    model_default: 'dolphin3:8b'
    base_url: 'http://192.0.2.20:11434'   # placeholder; replace per box
    usage_class: tight

  - name: lm-studio
    kind: http
    enabled: true
    cost_tier: local
    role: draft
    platform: local
    base_url: 'http://localhost:1234'
    model_default: 'qwen/qwen3-coder-30b'   # explicit pin per d043 — never 'auto'
    capabilities: [code-gen, code-transform, summarize-short, synthesize]
    context: 32768
    usage_class: broad

  # Small/judge specialist on the same LM Studio server as lm-studio above.
  # The explicit `judge` claim in capabilities drives selection — no file-order
  # dependency needed.
  - name: lm-studio-small
    kind: http
    enabled: true
    cost_tier: local
    role: draft
    platform: local
    base_url: 'http://localhost:1234'
    model_default: 'phi-4'                  # explicit pin per d043 — never 'auto'
    capabilities: [judge, commit-msg, extract-json, summarize-short]
    context: 16384
    usage_class: tight

  # ── OpenRouter: one key, ~400 models, pay-per-token. ────────────────────────
  # The first PREPAID provider in the fleet — every other paid row is a flat
  # subscription where over-use costs latency, not money. Two consequences:
  #   1. Set a credit limit on the KEY itself at openrouter.ai/settings/keys.
  #      That ceiling is vendor-enforced and cannot be bypassed by a Baton bug;
  #      the in-fleet policy is the second line of defence, never the only one.
  #   2. kind: http can never be agentic (d091) — these rows do review, judging,
  #      drafting and summarizing, not file edits.
  # Model ids move fast; check https://openrouter.ai/models before pinning, and
  # keep an explicit pin (never 'auto') so spend is attributable to a known model.
  # All three are disabled here: enable in your live ~/.baton/fleet.yaml.
  - name: openrouter
    kind: http
    enabled: false
    cost_tier: paid
    role: bulk
    platform: openrouter
    base_url: 'https://openrouter.ai/api'
    model_default: 'deepseek/deepseek-v4-flash'   # cheap 1M-context workhorse
    api_key_env: OPENROUTER_API_KEY
    headers:
      X-Title: Baton
    context: 1048576
    timeout_s: 180
    # Enable the credit probe in your live ~/.baton/fleet.yaml. soft_cap_credit
    # is percent of the KEY's credit limit spent; crossing it reroutes off this
    # row. It is the ergonomic guard — the vendor-side key limit is the real one.
    # usage_policy:
    #   probe: true
    #   probe_transport: openrouter-key
    #   soft_cap_credit: 85

  # Lineage diversity for the gates: a reviewer that shares no training ancestry
  # with claude / codex / gemini / grok is worth more on a panel than a fourth
  # frontier opinion. Non-reasoning by default — a thinking preamble breaks the
  # strict-JSON parse the review and judge capabilities depend on (see phi-4).
  - name: openrouter-gap
    kind: http
    enabled: false
    cost_tier: paid
    role: finisher
    platform: openrouter
    base_url: 'https://openrouter.ai/api'
    model_default: 'z-ai/glm-4.7'
    api_key_env: OPENROUTER_API_KEY
    headers:
      X-Title: Baton
    capabilities: [review, plan-review, judge, reasoning, synthesize]
    context: 204800
    timeout_s: 180

  # $0 rows: rate-limited and variable, so they claim only cheap utility work.
  # Free-tier daily request ceilings scale with the account's credit balance.
  - name: openrouter-free
    kind: http
    enabled: false
    cost_tier: free
    role: draft
    platform: openrouter
    base_url: 'https://openrouter.ai/api'
    model_default: 'nvidia/nemotron-3.5-lightning:free'
    api_key_env: OPENROUTER_API_KEY
    headers:
      X-Title: Baton
    capabilities: [summarize-short, classify, triage, extract-json]
    context: 1000000
    timeout_s: 180

  - name: github-models
    kind: cli
    enabled: false            # opt-in: enable in your live ~/.baton/fleet.yaml
    cost_tier: free
    adapter: github-models    # adapter-backed -> auto-metered + rate-limit-aware
    platform: github
    model_default: openai/gpt-4o-mini
    command_template: 'gh models run {{model}}'
    stdin: true               # pipe the prompt via stdin — gh models blocks reading
                              #   inherited stdin under pwsh; stdin is also quote-safe.
    capabilities: [code-gen, summarize-short, classify]
    # budget: <int>           # BOX-PRIVATE — set the real per-window allotment ONLY
    #                           in your live ~/.baton/fleet.yaml, never in this seed.
    saturate: false           # opt-in: set true (with a real budget) in live ~/.baton/fleet.yaml
    # saturation_target: 99.9 # optional; default is 99.9
