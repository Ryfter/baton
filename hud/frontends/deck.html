<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HUD · deck</title>
  <link rel="icon" href="data:,">
  <script>
    (function () {
      var ALLOWED = ["dark", "sapphire", "lapis-velvet", "sandstone"];
      var q = new URLSearchParams(location.search);
      var t = q.get("theme");
      if (t && ALLOWED.indexOf(t) >= 0) localStorage.setItem("hud-theme", t);
      else t = localStorage.getItem("hud-theme") || "dark";
      if (ALLOWED.indexOf(t) < 0) t = "dark";
      document.write('<link rel="stylesheet" id="hud-theme" href="/themes/' + t + '.css">');
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--hud-bg);
      color: var(--hud-text);
      font-family: var(--hud-font-mono);
      font-size: 13px;
      line-height: 1.45;
    }
    .hud-header {
      display: flex; align-items: center; gap: var(--hud-space-3);
      padding: var(--hud-space-3) var(--hud-space-4);
      border-bottom: 1px solid var(--hud-header-border);
      background: var(--hud-header-bg);
      position: sticky; top: 0; z-index: 10;
    }
    .hud-title {
      font-family: var(--hud-font-display, var(--hud-font-sans));
      font-weight: 650; font-size: 15px;
      color: var(--hud-text-strong);
    }
    .hud-dot {
      width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto;
      background: var(--hud-recon); transition: background .2s, box-shadow .2s;
    }
    .hud-dot.live {
      background: var(--hud-live);
      box-shadow: 0 0 0 3px var(--hud-live-glow), 0 0 12px var(--hud-live-glow);
    }
    .hud-meta {
      color: var(--hud-text-muted); font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .hud-meta strong { color: var(--hud-text-strong); font-weight: 600; }
    .hud-spacer { margin-left: auto; }
    .hud-link {
      color: var(--hud-link); text-decoration: none; font-size: 12px;
      border: 1px solid var(--hud-border); border-radius: var(--hud-radius-sm);
      padding: 4px 10px;
    }
    .hud-theme {
      background: var(--hud-surface); color: var(--hud-text);
      border: 1px solid var(--hud-border); border-radius: var(--hud-radius-sm);
      font: inherit; font-size: 11px; padding: 4px 8px; cursor: pointer;
    }
    .hud-theme:focus-visible, .hud-link:focus-visible {
      outline: 2px solid var(--hud-accent); outline-offset: 2px;
    }
    .lanes {
      display: flex; flex-direction: column; gap: var(--lane-gap, var(--hud-space-2));
      padding: var(--hud-space-3) var(--hud-space-3) 48px;
    }
    .lane {
      display: grid; grid-template-columns: minmax(140px, 220px) 1fr;
      gap: var(--hud-space-2);
      background: var(--hud-surface);
      border: 1px solid var(--hud-border);
      border-left: 3px solid var(--hud-accent-dim);
      border-radius: var(--hud-radius-md);
      padding: var(--lane-pad-y, var(--hud-space-2)) var(--lane-pad-x, var(--hud-space-3));
      min-height: 56px;
      animation: lane-in .32s cubic-bezier(.22, 1, .36, 1);
      transition: opacity .45s, border-left-color .3s;
    }
    .lane.active { border-left-color: var(--hud-accent); }
    .lane.idle { opacity: .32; }
    @keyframes lane-in {
      from { transform: translateY(-8px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .lane-label { padding: 6px 4px; min-width: 0; }
    .lane-id {
      color: var(--hud-link); font-weight: 700; font-size: 13px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .lane-meta {
      display: block; margin-top: 4px; font-size: 10px;
      color: var(--hud-text-faint);
    }
    .strip-wrap {
      display: flex; align-items: center; gap: 6px; min-width: 0;
    }
    .pin-slot { flex: 0 0 auto; display: flex; gap: 6px; align-items: center; }
    .pin-slot:empty { display: none; }
    .strip {
      display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px;
      min-width: 0; flex: 1;
      scrollbar-width: auto;
      scrollbar-color: var(--strip-thumb, var(--hud-border-strong)) var(--strip-track, var(--hud-surface-2));
    }
    .strip-wrap.scrolled .strip {
      -webkit-mask-image: linear-gradient(to right, transparent, #000 24px);
      mask-image: linear-gradient(to right, transparent, #000 24px);
    }
    .strip::-webkit-scrollbar { height: 8px; }
    .strip::-webkit-scrollbar-track { background: var(--strip-track, var(--hud-surface-2)); }
    .strip::-webkit-scrollbar-thumb {
      background: var(--strip-thumb, var(--hud-border-strong));
      border-radius: 4px;
    }
    .chip {
      flex: 0 0 auto; border-radius: var(--chip-radius, var(--hud-radius-sm));
      padding: var(--chip-pad-y, 5px) var(--chip-pad-x, 9px);
      font-size: var(--chip-font, 11px); white-space: nowrap;
      background: var(--chip-meta-bg); color: var(--chip-meta-fg);
      border: 1px solid var(--chip-border, transparent);
      box-shadow: var(--chip-shadow, none);
    }
    .chip.tool { background: var(--chip-tool-bg); color: var(--chip-tool-fg); }
    .chip.tool-fail {
      background: var(--chip-tool-fail-bg); color: var(--chip-tool-fail-fg);
      border-color: var(--chip-fail-border, var(--hud-error));
    }
    .chip.wait { background: var(--chip-wait-bg); color: var(--chip-wait-fg); }
    .chip.end { background: var(--chip-end-bg); color: var(--chip-end-fg); }
    .chip.meta { background: var(--chip-meta-bg); color: var(--chip-meta-fg); }
    .empty-state {
      margin: var(--hud-space-5); padding: var(--hud-space-5);
      text-align: center; color: var(--hud-text-faint);
      border: 1px dashed var(--hud-border); border-radius: var(--hud-radius-lg);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header class="hud-header">
    <span id="dot" class="hud-dot" title="connection" aria-label="connection"></span>
    <span class="hud-title">Flight deck</span>
    <span class="hud-meta">events <strong id="count">0</strong></span>
    <span class="hud-meta">lanes <strong id="lane-count">0</strong></span>
    <span class="hud-spacer"></span>
    <select id="theme-pick" class="hud-theme" aria-label="Theme">
      <option value="dark">dark</option>
      <option value="sapphire">sapphire</option>
      <option value="lapis-velvet">lapis-velvet</option>
      <option value="sandstone">sandstone</option>
    </select>
    <a class="hud-link" href="/">views</a>
  </header>
  <div class="lanes" id="lanes">
    <p class="empty-state" id="empty">Awaiting telemetry…</p>
  </div>
  <script>
    var MAX = 500;
    var MAX_SESSIONS = 200;
    var IDLE_MS = 5 * 60 * 1000;
    var ALLOWED = ["dark", "sapphire", "lapis-velvet", "sandstone"];
    var total = 0;
    var sessions = {};
    var order = [];
    var chipCount = 0;
    var lanesEl = document.getElementById("lanes");
    var emptyEl = document.getElementById("empty");
    var countEl = document.getElementById("count");
    var laneCountEl = document.getElementById("lane-count");
    var dot = document.getElementById("dot");
    var themePick = document.getElementById("theme-pick");

    function shortId(id) {
      id = String(id || "");
      if (id.length <= 14) return id;
      return "…" + id.slice(-13);
    }
    function chipFamily(ev) {
      var kind = ev.kind || "";
      if (kind === "post_tool_use" && ev.payload && ev.payload.ok === false) return "tool-fail";
      if (kind === "pre_tool_use" || kind === "post_tool_use") return "tool";
      if (kind === "notification") return "wait";
      if (kind === "stop" || kind === "subagent_stop") return "end";
      return "meta";
    }
    function truncate(s, n) {
      s = String(s || "").replace(/\s+/g, " ").trim();
      if (s.length <= n) return s;
      return s.slice(0, n - 1) + "…";
    }
    function chipText(ev) {
      var p = ev.payload || {};
      var kind = ev.kind || "";
      var tool = p.tool_name || "";
      if (kind === "session_start") return "start";
      if (kind === "user_prompt") return truncate(p.prompt || "", 22) || "prompt";
      if (kind === "pre_tool_use") return tool || "tool";
      if (kind === "post_tool_use") return (tool || "tool") + (p.ok === false ? " ✗" : " ✓");
      if (kind === "notification") return "notify";
      if (kind === "stop") return "stop";
      if (kind === "subagent_stop") return "sub ✓";
      if (kind === "pre_compact") return "compact";
      return kind;
    }
    function chipTitle(ev) {
      var p = ev.payload || {};
      var kind = ev.kind || "";
      var tool = p.tool_name || "";
      var head = tool ? kind + " · " + tool : kind;
      var extra = p.error || p.tool_input_summary || p.prompt || p.message || p.cwd || p.trigger || p.agent || p.source || "";
      if (extra && String(extra) !== tool) return head + " — " + extra;
      return head;
    }
    function parseTs(ev) {
      if (!ev.ts) return Date.now();
      var t = Date.parse(ev.ts);
      return isNaN(t) ? Date.now() : t;
    }
    function syncEmpty() {
      var n = Object.keys(sessions).length;
      if (emptyEl) emptyEl.hidden = n > 0;
      laneCountEl.textContent = String(n);
    }
    function updatePin(lane) {
      var slot = lane.pin;
      slot.textContent = "";
      if (lane.origin) {
        var origin = document.createElement("span");
        origin.className = "chip " + lane.origin.family;
        origin.textContent = lane.origin.text;
        origin.title = lane.origin.title;
        slot.appendChild(origin);
      } else if (lane.hidden > 0) {
        var older = document.createElement("span");
        older.className = "chip meta";
        older.textContent = "+" + lane.hidden + " older";
        older.title = lane.hidden + " earlier events not shown";
        slot.appendChild(older);
      }
    }
    function bindStripFade(strip, wrap) {
      function sync() {
        if (strip.scrollLeft > 4) wrap.classList.add("scrolled");
        else wrap.classList.remove("scrolled");
      }
      strip.addEventListener("scroll", sync, { passive: true });
      return sync;
    }
    function ensureLane(sid, ev) {
      if (!sessions[sid]) {
        var lane = document.createElement("div");
        lane.className = "lane active";
        var label = document.createElement("div");
        label.className = "lane-label";
        label.innerHTML = '<div class="lane-id"></div><small class="lane-meta"></small>';
        label.querySelector(".lane-id").textContent = shortId(sid);
        label.querySelector(".lane-id").title = sid;
        label.querySelector(".lane-meta").textContent = ev.machine || "—";
        var wrap = document.createElement("div");
        wrap.className = "strip-wrap";
        var pin = document.createElement("div");
        pin.className = "pin-slot";
        var strip = document.createElement("div");
        strip.className = "strip";
        wrap.appendChild(pin);
        wrap.appendChild(strip);
        lane.appendChild(label);
        lane.appendChild(wrap);
        sessions[sid] = {
          el: lane, strip: strip, wrap: wrap, pin: pin,
          last: Date.now(), chips: [], hidden: 0, origin: null,
          syncFade: bindStripFade(strip, wrap)
        };
        order.unshift(sid);
        lanesEl.insertBefore(lane, lanesEl.firstChild);
        while (order.length > MAX_SESSIONS) {
          var dropped = order.pop();
          var s = sessions[dropped];
          if (s && s.el && s.el.parentNode) s.el.parentNode.removeChild(s.el);
          delete sessions[dropped];
        }
        syncEmpty();
      }
      return sessions[sid];
    }
    function bumpLane(sid) {
      var idx = order.indexOf(sid);
      if (idx > 0) {
        order.splice(idx, 1);
        order.unshift(sid);
        lanesEl.insertBefore(sessions[sid].el, lanesEl.firstChild);
      }
    }
    function trimOldest() {
      while (chipCount > MAX) {
        for (var i = order.length - 1; i >= 0; i--) {
          var s = sessions[order[i]];
          if (s.chips.length) {
            var node = s.chips.shift();
            if (node.parentNode) node.parentNode.removeChild(node);
            s.hidden += 1;
            chipCount--;
            updatePin(s);
            break;
          }
        }
      }
    }
    function onEvent(ev) {
      var sid = ev.session_id || "unknown";
      var lane = ensureLane(sid, ev);
      lane.last = parseTs(ev);
      lane.el.classList.remove("idle");
      lane.el.classList.add("active");
      bumpLane(sid);
      if (ev.kind === "session_start" && !lane.origin) {
        lane.origin = {
          text: chipText(ev),
          title: chipTitle(ev),
          family: chipFamily(ev)
        };
        updatePin(lane);
      } else {
        var chip = document.createElement("span");
        chip.className = "chip " + chipFamily(ev);
        chip.textContent = chipText(ev);
        chip.title = chipTitle(ev);
        lane.strip.appendChild(chip);
        lane.chips.push(chip);
        chipCount++;
        lane.strip.scrollLeft = lane.strip.scrollWidth;
        if (lane.syncFade) lane.syncFade();
      }
      total++;
      countEl.textContent = String(total);
      trimOldest();
    }
    setInterval(function () {
      var now = Date.now();
      Object.keys(sessions).forEach(function (sid) {
        var s = sessions[sid];
        if (now - s.last > IDLE_MS) {
          s.el.classList.add("idle");
          s.el.classList.remove("active");
        } else {
          s.el.classList.remove("idle");
          s.el.classList.add("active");
        }
      });
    }, 10000);

    function currentTheme() {
      var q = new URLSearchParams(location.search).get("theme");
      var t = q || localStorage.getItem("hud-theme") || "dark";
      return ALLOWED.indexOf(t) >= 0 ? t : "dark";
    }
    function applyTheme(t) {
      localStorage.setItem("hud-theme", t);
      document.getElementById("hud-theme").href = "/themes/" + t + ".css";
      var u = new URL(location.href);
      u.searchParams.set("theme", t);
      history.replaceState(null, "", u);
    }
    themePick.value = currentTheme();
    themePick.addEventListener("change", function () { applyTheme(themePick.value); });

    var hudTok = new URLSearchParams(location.search).get("t") || "";
    if (hudTok) {
      document.querySelectorAll("a.hud-link").forEach(function (a) {
        var href = a.getAttribute("href") || "";
        if (href && href.indexOf("t=") < 0) {
          a.setAttribute("href", href + (href.indexOf("?") >= 0 ? "&" : "?") + "t=" + encodeURIComponent(hudTok));
        }
      });
    }
    var es = new EventSource('/stream?replay=200' + (hudTok ? '&t=' + encodeURIComponent(hudTok) : ''));
    es.addEventListener("open", function () { dot.className = "hud-dot live"; });
    es.addEventListener("error", function () { dot.className = "hud-dot"; });
    es.addEventListener("hud", function (e) {
      try { onEvent(JSON.parse(e.data)); } catch (err) {}
    });
  </script>
</body>
</html>
