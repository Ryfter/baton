<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HUD · cockpit</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" id="hud-theme" href="/themes/dark.css">
  <script>
    (function () {
      var ALLOWED = ["dark", "sapphire", "lapis-velvet", "sandstone"];
      var q = new URLSearchParams(location.search);
      var t = q.get("theme");
      if (t && ALLOWED.indexOf(t) >= 0) localStorage.setItem("hud-theme", t);
      else t = localStorage.getItem("hud-theme") || "dark";
      if (ALLOWED.indexOf(t) < 0) t = "dark";
      document.getElementById("hud-theme").href = "/themes/" + t + ".css";
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--hud-bg);
      color: var(--hud-text);
      font-family: var(--hud-font-sans);
      font-size: 13px;
    }
    .hud-header {
      display: flex; align-items: center; gap: var(--hud-space-3);
      padding: var(--hud-space-3) var(--hud-space-4);
      border-bottom: 1px solid var(--hud-header-border);
      background: var(--hud-header-bg);
      backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 10;
    }
    .hud-brand { display: flex; flex-direction: column; gap: 2px; }
    .hud-title {
      letter-spacing: .18em; font-weight: 700; font-size: 11px;
      text-transform: uppercase; color: var(--hud-text-strong);
    }
    .hud-subtitle { font-size: 10px; color: var(--hud-text-faint); letter-spacing: .06em; }
    .hud-dot {
      width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto;
      background: var(--hud-recon);
    }
    .hud-dot.live {
      background: var(--hud-live);
      box-shadow: 0 0 0 3px var(--hud-live-glow), 0 0 12px var(--hud-live-glow);
    }
    .hud-meta {
      color: var(--hud-text-muted); font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .hud-meta strong { color: var(--hud-text-strong); }
    .hud-spacer { margin-left: auto; }
    .hud-link {
      color: var(--hud-link); text-decoration: none; font-size: 12px;
      border: 1px solid var(--hud-border); border-radius: var(--hud-radius-sm);
      padding: 4px 10px;
    }
    .hud-theme {
      background: var(--hud-surface); color: var(--hud-text);
      border: 1px solid var(--hud-border); border-radius: var(--hud-radius-sm);
      font: inherit; font-size: 11px; padding: 4px 8px; cursor: pointer;
    }
    .instruments {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: var(--hud-space-3); padding: var(--hud-space-4) var(--hud-space-4) var(--hud-space-2);
    }
    .tile {
      background: var(--hud-surface);
      border: 1px solid var(--hud-border);
      border-radius: var(--hud-radius-lg);
      padding: var(--hud-space-4);
      position: relative; overflow: hidden;
    }
    .tile::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--accent);
    }
    .tile::after {
      content: ""; position: absolute; right: -20px; top: -20px;
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--accent); opacity: .06;
    }
    .tile .val {
      font-size: 32px; font-weight: 700; line-height: 1;
      font-variant-numeric: tabular-nums;
      font-family: var(--hud-font-mono);
      color: var(--accent);
    }
    .tile .lbl {
      margin-top: 6px; font-size: 10px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--hud-text-muted);
    }
    .tile-sessions { --accent: var(--tile-sessions); }
    .tile-rate     { --accent: var(--tile-rate); }
    .tile-tools    { --accent: var(--tile-tools); }
    .tile-errors   { --accent: var(--tile-errors); }
    .spark-panel {
      margin: 0 var(--hud-space-4) var(--hud-space-3);
      padding: var(--hud-space-3) var(--hud-space-4);
      background: var(--hud-surface);
      border: 1px solid var(--hud-border);
      border-radius: var(--hud-radius-lg);
    }
    .spark-label {
      font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--hud-text-muted); margin-bottom: var(--hud-space-2);
    }
    svg { width: 100%; height: 120px; display: block; }
    .grid-line { stroke: var(--hud-border); stroke-width: 1; }
    .feed-wrap {
      margin: 0 var(--hud-space-4) var(--hud-space-5);
      border: 1px solid var(--hud-border);
      border-radius: var(--hud-radius-lg);
      overflow: hidden;
      background: var(--hud-surface);
    }
    .feed-head {
      padding: var(--hud-space-2) var(--hud-space-4);
      border-bottom: 1px solid var(--hud-border);
      font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--hud-text-muted);
      display: grid; grid-template-columns: 72px 88px 130px 1fr; gap: var(--hud-space-2);
      font-family: var(--hud-font-mono);
    }
    .feed { font-family: var(--hud-font-mono); font-size: 11px; max-height: 52vh; overflow-y: auto; }
    .line {
      display: grid; grid-template-columns: 72px 88px 130px 1fr; gap: var(--hud-space-2);
      padding: 6px var(--hud-space-4);
      border-bottom: 1px solid var(--hud-border);
      color: var(--hud-text);
      animation: line-in .2s ease;
    }
    .line:nth-child(even) { background: var(--hud-surface-2); }
    @keyframes line-in {
      from { opacity: 0; transform: translateX(-4px); }
      to { opacity: 1; transform: none; }
    }
    .kind {
      display: inline-block; padding: 2px 7px; border-radius: var(--hud-radius-sm);
      font-size: 10px; white-space: nowrap;
      background: var(--chip-default-bg); color: var(--chip-default-fg);
    }
    .kind.session_start { background: var(--chip-session-start-bg); color: var(--chip-session-start-fg); }
    .kind.user_prompt   { background: var(--chip-user-prompt-bg); color: var(--chip-user-prompt-fg); }
    .kind.pre_tool_use  { background: var(--chip-pre-tool-bg); color: var(--chip-pre-tool-fg); }
    .kind.post_tool_use { background: var(--chip-post-tool-bg); color: var(--chip-post-tool-fg); }
    .kind.error         { background: var(--chip-error-bg); color: var(--chip-error-fg); }
    .kind.notification  { background: var(--chip-notification-bg); color: var(--chip-notification-fg); }
    .kind.stop          { background: var(--chip-stop-bg); color: var(--chip-stop-fg); }
    .kind.subagent_stop { background: var(--chip-subagent-bg); color: var(--chip-subagent-fg); }
    .kind.pre_compact   { background: var(--chip-compact-bg); color: var(--chip-compact-fg); }
    .line.err .detail { color: var(--hud-error); }
    .t { color: var(--hud-text-faint); font-variant-numeric: tabular-nums; }
    .sid { color: var(--hud-link); }
    .detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 900px) {
      .instruments { grid-template-columns: 1fr 1fr; }
      .feed-head, .line { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="hud-header">
    <span id="dot" class="hud-dot"></span>
    <div class="hud-brand">
      <span class="hud-title">Cockpit</span>
      <span class="hud-subtitle">instruments + live feed</span>
    </div>
    <span class="hud-meta">events <strong id="count">0</strong></span>
    <span class="hud-spacer"></span>
    <select id="theme-pick" class="hud-theme" aria-label="Theme">
      <option value="dark">dark</option>
      <option value="sapphire">sapphire</option>
      <option value="lapis-velvet">lapis-velvet</option>
      <option value="sandstone">sandstone</option>
    </select>
    <a class="hud-link" href="/">views</a>
  </header>
  <div class="instruments">
    <div class="tile tile-sessions"><div class="val" id="t-active">0</div><div class="lbl">Active sessions</div></div>
    <div class="tile tile-rate"><div class="val" id="t-epm">0</div><div class="lbl">Events / min</div></div>
    <div class="tile tile-tools"><div class="val" id="t-tools">0</div><div class="lbl">Tool calls</div></div>
    <div class="tile tile-errors"><div class="val" id="t-err">0</div><div class="lbl">Errors</div></div>
  </div>
  <div class="spark-panel">
    <div class="spark-label">Throughput — last 60s</div>
    <svg id="spark" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--spark-stroke)" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="var(--spark-stroke)" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      <line class="grid-line" x1="0" y1="30" x2="600" y2="30"/>
      <line class="grid-line" x1="0" y1="60" x2="600" y2="60"/>
      <line class="grid-line" x1="0" y1="90" x2="600" y2="90"/>
      <polygon id="spark-area" fill="url(#sparkFill)" points="0,120 600,120"/>
      <polyline id="spark-line" fill="none" stroke="var(--spark-stroke)" stroke-width="2"
                stroke-linejoin="round" stroke-linecap="round" points=""/>
    </svg>
  </div>
  <div class="feed-wrap">
    <div class="feed-head"><span>time</span><span>session</span><span>kind</span><span>detail</span></div>
    <div class="feed" id="feed"></div>
  </div>
  <script>
    var MAX = 500;
    var events = [];
    var lastKind = {};
    var toolCalls = 0;
    var errors = 0;
    var total = 0;
    var BUCKETS = 30;
    var BUCKET_MS = 2000;
    var feed = document.getElementById("feed");
    var dot = document.getElementById("dot");
    var countEl = document.getElementById("count");
    var poly = document.getElementById("spark-line");
    var area = document.getElementById("spark-area");
    var themePick = document.getElementById("theme-pick");

    function jitter(n) { return n + (Math.random() * 1.2 - 0.6); }
    function isError(ev) {
      return ev.kind === "post_tool_use" && ev.payload && ev.payload.ok === false;
    }
    function kindClass(ev) {
      if (isError(ev)) return "error";
      return ev.kind || "";
    }
    function detail(ev) {
      var p = ev.payload || {};
      if (p.tool_name) return p.tool_name + (p.ok === false ? " FAIL" : "");
      if (p.message) return p.message;
      if (p.prompt) return p.prompt;
      if (p.trigger) return String(p.trigger);
      if (p.source) return String(p.source);
      return "";
    }
    function shortId(id) {
      id = String(id || "");
      return id.length > 10 ? id.slice(0, 8) + "…" : id;
    }
    function clock(ts) {
      var d = new Date(Date.parse(ts) || Date.now());
      return d.toISOString().slice(11, 19);
    }
    function recompute() {
      var now = Date.now();
      var cutoff = now - 60000;
      var epm = 0;
      var active = {};
      lastKind = {};
      for (var i = 0; i < events.length; i++) {
        var ev = events[i];
        lastKind[ev.session_id] = ev.kind;
        var t = Date.parse(ev.ts);
        if (!isNaN(t) && t >= cutoff) epm++;
        else if (isNaN(t)) epm++;
      }
      Object.keys(lastKind).forEach(function (sid) {
        if (lastKind[sid] !== "stop") active[sid] = true;
      });
      document.getElementById("t-active").textContent = String(Object.keys(active).length);
      document.getElementById("t-epm").textContent = String(epm);
      document.getElementById("t-tools").textContent = String(toolCalls);
      document.getElementById("t-err").textContent = String(errors);
      drawSpark(now);
    }
    function drawSpark(now) {
      var counts = [];
      var i, W = 600, H = 120, pad = 10;
      for (i = 0; i < BUCKETS; i++) counts[i] = 0;
      for (i = 0; i < events.length; i++) {
        var t = Date.parse(events[i].ts);
        if (isNaN(t)) t = now;
        var ago = now - t;
        var idx = BUCKETS - 1 - Math.floor(ago / BUCKET_MS);
        if (idx >= 0 && idx < BUCKETS) counts[idx]++;
      }
      var max = 1;
      for (i = 0; i < counts.length; i++) if (counts[i] > max) max = counts[i];
      var pts = [];
      for (i = 0; i < counts.length; i++) {
        var x = (i / (BUCKETS - 1)) * W;
        var y = H - pad - (counts[i] / max) * (H - pad * 2);
        if (counts[i] > 0) { x = jitter(x); y = jitter(y); }
        pts.push(x.toFixed(1) + "," + y.toFixed(1));
      }
      poly.setAttribute("points", pts.join(" "));
      area.setAttribute("points", pts.join(" ") + " " + W + "," + H + " 0," + H);
    }
    function onEvent(ev) {
      events.push(ev);
      if (events.length > MAX) events.shift();
      if (ev.kind === "pre_tool_use") toolCalls++;
      if (isError(ev)) errors++;
      total++;
      countEl.textContent = String(total);
      var line = document.createElement("div");
      line.className = "line" + (isError(ev) ? " err" : "");
      var timeEl = document.createElement("span");
      timeEl.className = "t";
      timeEl.textContent = clock(ev.ts);
      var sidEl = document.createElement("span");
      sidEl.className = "sid";
      sidEl.textContent = shortId(ev.session_id);
      var kindEl = document.createElement("span");
      kindEl.className = "kind " + kindClass(ev);
      kindEl.textContent = ev.kind || "";
      var detEl = document.createElement("span");
      detEl.className = "detail";
      detEl.textContent = detail(ev);
      line.appendChild(timeEl);
      line.appendChild(sidEl);
      line.appendChild(kindEl);
      line.appendChild(detEl);
      feed.insertBefore(line, feed.firstChild);
      while (feed.childNodes.length > MAX) feed.removeChild(feed.lastChild);
      recompute();
    }

    themePick.value = localStorage.getItem("hud-theme") || "dark";
    themePick.addEventListener("change", function () {
      localStorage.setItem("hud-theme", themePick.value);
      document.getElementById("hud-theme").href = "/themes/" + themePick.value + ".css";
    });

    var es = new EventSource('/stream?replay=200');
    es.addEventListener("open", function () { dot.className = "hud-dot live"; });
    es.addEventListener("error", function () { dot.className = "hud-dot"; });
    es.addEventListener("hud", function (e) {
      try { onEvent(JSON.parse(e.data)); } catch (err) {}
    });
    setInterval(recompute, 2000);
  </script>
</body>
</html>
