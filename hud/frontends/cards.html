<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HUD · cards</title>
  <link rel="icon" href="data:,">
  <script>
    (function () {
      var ALLOWED = ["dark", "sapphire", "lapis-velvet", "sandstone"];
      var q = new URLSearchParams(location.search);
      var t = q.get("theme");
      if (t && ALLOWED.indexOf(t) >= 0) localStorage.setItem("hud-theme", t);
      else t = localStorage.getItem("hud-theme") || "dark";
      if (ALLOWED.indexOf(t) < 0) t = "dark";
      document.write('<link rel="stylesheet" id="hud-theme" href="/themes/' + t + '.css">');
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--hud-bg);
      color: var(--hud-text);
      font-family: var(--hud-font-mono);
      font-size: 13px;
    }
    .hud-header {
      display: flex; align-items: center; gap: var(--hud-space-3);
      padding: var(--hud-space-3) var(--hud-space-4);
      border-bottom: 1px solid var(--hud-header-border);
      background: var(--hud-header-bg);
      position: sticky; top: 0; z-index: 10;
    }
    .hud-title {
      font-family: var(--hud-font-display, var(--hud-font-sans));
      font-weight: 650; font-size: 15px;
      color: var(--hud-text-strong);
    }
    .hud-dot {
      width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto;
      background: var(--hud-recon);
    }
    .hud-dot.live {
      background: var(--hud-live);
      box-shadow: 0 0 0 3px var(--hud-live-glow), 0 0 12px var(--hud-live-glow);
    }
    .hud-meta {
      color: var(--hud-text-muted); font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .hud-meta strong { color: var(--hud-text-strong); }
    .hud-spacer { margin-left: auto; }
    .hud-link {
      color: var(--hud-link); text-decoration: none; font-size: 12px;
      border: 1px solid var(--hud-border); border-radius: var(--hud-radius-sm);
      padding: 4px 10px;
    }
    .hud-theme {
      background: var(--hud-surface); color: var(--hud-text);
      border: 1px solid var(--hud-border); border-radius: var(--hud-radius-sm);
      font: inherit; font-size: 11px; padding: 4px 8px; cursor: pointer;
    }
    .hud-theme:focus-visible, .hud-link:focus-visible {
      outline: 2px solid var(--hud-accent); outline-offset: 2px;
    }
    .page { padding: var(--hud-space-3) var(--hud-space-4) 48px; }
    .empty-state {
      margin: var(--hud-space-5); padding: var(--hud-space-5);
      text-align: center; color: var(--hud-text-faint);
      border: 1px dashed var(--hud-border); border-radius: var(--hud-radius-lg);
    }
    .deck {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--hud-space-3);
      align-items: start;
    }
    .card {
      background: var(--hud-surface);
      border: 1px solid var(--hud-border);
      border-radius: var(--hud-radius-md);
      padding: var(--hud-space-3);
      min-width: 0;
      animation: card-in .3s cubic-bezier(.22, 1, .36, 1);
    }
    @keyframes card-in {
      from { transform: translateY(-6px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .card-head {
      display: flex; align-items: center; gap: var(--hud-space-2);
      margin-bottom: var(--hud-space-2); min-width: 0;
    }
    .sid {
      color: var(--hud-link); font-weight: 700; font-size: 13px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .machine { color: var(--hud-text-faint); font-size: 10px; }
    .pill {
      margin-left: auto; flex: 0 0 auto;
      font-size: 10px; padding: 3px 9px; border-radius: 999px; font-weight: 650;
    }
    .pill.running { background: var(--chip-tool-bg); color: var(--chip-tool-fg); }
    .pill.needs   { background: var(--chip-wait-bg); color: var(--chip-wait-fg); }
    .pill.stopped { background: var(--chip-end-bg); color: var(--chip-end-fg); }
    .chips {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: var(--hud-space-2) 0;
    }
    .chip {
      flex: 0 0 auto; border-radius: var(--chip-radius, var(--hud-radius-sm));
      padding: var(--chip-pad-y, 4px) var(--chip-pad-x, 8px);
      font-size: var(--chip-font, 11px); white-space: nowrap;
      background: var(--chip-meta-bg); color: var(--chip-meta-fg);
      border: 1px solid var(--chip-border, transparent);
      box-shadow: var(--chip-shadow, none);
    }
    .chip.tool { background: var(--chip-tool-bg); color: var(--chip-tool-fg); }
    .chip.tool-fail {
      background: var(--chip-tool-fail-bg); color: var(--chip-tool-fail-fg);
      border-color: var(--chip-fail-border, var(--hud-error));
    }
    .chip.wait { background: var(--chip-wait-bg); color: var(--chip-wait-fg); }
    .chip.end { background: var(--chip-end-bg); color: var(--chip-end-fg); }
    .chip.meta { background: var(--chip-meta-bg); color: var(--chip-meta-fg); }
    .foot {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--hud-border);
      padding-top: var(--hud-space-2);
      color: var(--hud-text-faint); font-size: 10px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <header class="hud-header">
    <span id="dot" class="hud-dot" aria-label="connection"></span>
    <span class="hud-title">Session cards</span>
    <span class="hud-meta">events <strong id="count">0</strong></span>
    <span class="hud-meta">sessions <strong id="session-count">0</strong></span>
    <span class="hud-spacer"></span>
    <select id="theme-pick" class="hud-theme" aria-label="Theme">
      <option value="dark">dark</option>
      <option value="sapphire">sapphire</option>
      <option value="lapis-velvet">lapis-velvet</option>
      <option value="sandstone">sandstone</option>
    </select>
    <a class="hud-link" href="/">views</a>
  </header>
  <div class="page">
    <p class="empty-state" id="empty">Awaiting telemetry…</p>
    <div class="deck" id="deck"></div>
  </div>
  <script>
    var MAX = 500;
    var MAX_SESSIONS = 200;
    var CHIP_CAP = 12;
    var ALLOWED = ["dark", "sapphire", "lapis-velvet", "sandstone"];
    var total = 0;
    var chipCount = 0;
    var sessions = {};
    var order = [];
    var deck = document.getElementById("deck");
    var emptyEl = document.getElementById("empty");
    var countEl = document.getElementById("count");
    var sessionCountEl = document.getElementById("session-count");
    var dot = document.getElementById("dot");
    var themePick = document.getElementById("theme-pick");

    function shortId(id) {
      id = String(id || "");
      if (id.length <= 14) return id;
      return "…" + id.slice(-13);
    }
    function chipFamily(ev) {
      var kind = ev.kind || "";
      if (kind === "post_tool_use" && ev.payload && ev.payload.ok === false) return "tool-fail";
      if (kind === "pre_tool_use" || kind === "post_tool_use") return "tool";
      if (kind === "notification") return "wait";
      if (kind === "stop" || kind === "subagent_stop") return "end";
      return "meta";
    }
    function truncate(s, n) {
      s = String(s || "").replace(/\s+/g, " ").trim();
      if (s.length <= n) return s;
      return s.slice(0, n - 1) + "…";
    }
    function chipText(ev) {
      var p = ev.payload || {};
      var kind = ev.kind || "";
      var tool = p.tool_name || "";
      if (kind === "session_start") return "start";
      if (kind === "user_prompt") return truncate(p.prompt || "", 22) || "prompt";
      if (kind === "pre_tool_use") return tool || "tool";
      if (kind === "post_tool_use") return (tool || "tool") + (p.ok === false ? " ✗" : " ✓");
      if (kind === "notification") return "notify";
      if (kind === "stop") return "stop";
      if (kind === "subagent_stop") return "sub ✓";
      if (kind === "pre_compact") return "compact";
      return kind;
    }
    function chipTitle(ev) {
      var p = ev.payload || {};
      var kind = ev.kind || "";
      var tool = p.tool_name || "";
      var head = tool ? kind + " · " + tool : kind;
      var extra = p.error || p.tool_input_summary || p.prompt || p.message || p.cwd || p.trigger || p.agent || p.source || "";
      if (extra && String(extra) !== tool) return head + " — " + extra;
      return head;
    }
    function statusOf(kind) {
      if (kind === "stop") return "stopped";
      if (kind === "notification") return "needs-you";
      return "running";
    }
    function pillClass(status) {
      if (status === "stopped") return "stopped";
      if (status === "needs-you") return "needs";
      return "running";
    }
    function pillLabel(status) {
      if (status === "stopped") return "stopped";
      if (status === "needs-you") return "needs you";
      return "running";
    }
    function age(ts) {
      var t = Date.parse(ts);
      if (isNaN(t)) t = Date.now();
      var s = Math.max(0, Math.round((Date.now() - t) / 1000));
      if (s < 60) return s + "s ago";
      if (s < 3600) return Math.round(s / 60) + "m ago";
      return Math.round(s / 3600) + "h ago";
    }
    function syncEmpty() {
      var n = Object.keys(sessions).length;
      if (emptyEl) emptyEl.hidden = n > 0;
      sessionCountEl.textContent = String(n);
    }
    function makeChip(ev) {
      var chip = document.createElement("span");
      chip.className = "chip " + chipFamily(ev);
      chip.textContent = chipText(ev);
      chip.title = chipTitle(ev);
      return chip;
    }
    function ensureCard(sid, ev) {
      if (!sessions[sid]) {
        var card = document.createElement("article");
        card.className = "card";
        card.innerHTML =
          '<div class="card-head"><span class="sid"></span><span class="machine"></span><span class="pill running">running</span></div>' +
          '<div class="chips"></div>' +
          '<div class="foot"><span class="n"></span><span class="age"></span></div>';
        var sidEl = card.querySelector(".sid");
        sidEl.textContent = shortId(sid);
        sidEl.title = sid;
        card.querySelector(".machine").textContent = ev.machine || "";
        sessions[sid] = {
          el: card,
          chipsEl: card.querySelector(".chips"),
          pill: card.querySelector(".pill"),
          nEl: card.querySelector(".n"),
          ageEl: card.querySelector(".age"),
          machineEl: card.querySelector(".machine"),
          events: [],
          count: 0,
          kind: "",
          ts: ev.ts
        };
        order.unshift(sid);
        deck.insertBefore(card, deck.firstChild);
        while (order.length > MAX_SESSIONS) {
          var dropped = order.pop();
          var s = sessions[dropped];
          if (s && s.el && s.el.parentNode) s.el.parentNode.removeChild(s.el);
          delete sessions[dropped];
        }
        syncEmpty();
      }
      return sessions[sid];
    }
    function bumpCard(sid) {
      var idx = order.indexOf(sid);
      if (idx > 0) {
        order.splice(idx, 1);
        order.unshift(sid);
        deck.insertBefore(sessions[sid].el, deck.firstChild);
      }
    }
    function trimOldest() {
      while (chipCount > MAX) {
        for (var i = order.length - 1; i >= 0; i--) {
          var s = sessions[order[i]];
          if (s.events.length) {
            s.events.shift();
            if (s.chipsEl.firstChild) s.chipsEl.removeChild(s.chipsEl.firstChild);
            chipCount--;
            break;
          }
        }
      }
    }
    function onEvent(ev) {
      var sid = ev.session_id || "unknown";
      var st = ensureCard(sid, ev);
      st.count += 1;
      st.kind = ev.kind;
      st.ts = ev.ts;
      if (ev.machine) st.machineEl.textContent = ev.machine;
      var status = statusOf(ev.kind);
      st.pill.className = "pill " + pillClass(status);
      st.pill.textContent = pillLabel(status);
      st.events.push(ev);
      st.chipsEl.appendChild(makeChip(ev));
      chipCount++;
      while (st.events.length > CHIP_CAP) {
        st.events.shift();
        if (st.chipsEl.firstChild) st.chipsEl.removeChild(st.chipsEl.firstChild);
        chipCount--;
      }
      st.nEl.textContent = st.count + " events";
      st.ageEl.textContent = age(st.ts);
      bumpCard(sid);
      total++;
      countEl.textContent = String(total);
      trimOldest();
    }
    setInterval(function () {
      Object.keys(sessions).forEach(function (sid) {
        sessions[sid].ageEl.textContent = age(sessions[sid].ts);
      });
    }, 5000);

    function currentTheme() {
      var q = new URLSearchParams(location.search).get("theme");
      var t = q || localStorage.getItem("hud-theme") || "dark";
      return ALLOWED.indexOf(t) >= 0 ? t : "dark";
    }
    function applyTheme(t) {
      localStorage.setItem("hud-theme", t);
      document.getElementById("hud-theme").href = "/themes/" + t + ".css";
      var u = new URL(location.href);
      u.searchParams.set("theme", t);
      history.replaceState(null, "", u);
    }
    themePick.value = currentTheme();
    themePick.addEventListener("change", function () { applyTheme(themePick.value); });

    var hudTok = new URLSearchParams(location.search).get("t") || "";
    if (hudTok) {
      document.querySelectorAll("a.hud-link").forEach(function (a) {
        var href = a.getAttribute("href") || "";
        if (href && href.indexOf("t=") < 0) {
          a.setAttribute("href", href + (href.indexOf("?") >= 0 ? "&" : "?") + "t=" + encodeURIComponent(hudTok));
        }
      });
    }
    var es = new EventSource('/stream?replay=200' + (hudTok ? '&t=' + encodeURIComponent(hudTok) : ''));
    es.addEventListener("open", function () { dot.className = "hud-dot live"; });
    es.addEventListener("error", function () { dot.className = "hud-dot"; });
    es.addEventListener("hud", function (e) {
      try { onEvent(JSON.parse(e.data)); } catch (err) {}
    });
  </script>
</body>
</html>
