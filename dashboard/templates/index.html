{% extends "base.html" %}
{% block content %}

<div id="home-header"
     hx-get="/partials/home-header"
     hx-trigger="load, every 2s"
     hx-swap="innerHTML">
  {% include "partials/home_header.html" %}
</div>

<div class="card maestro-compose-card maestro-compose-card--compact" id="maestro-compose-card" style="grid-column: 1 / -1;"
     hx-get="/maestro/partials/compose?compact=1"
     hx-trigger="load"
     hx-swap="innerHTML">
  <div class="maestro-compose maestro-compose--boot">
    <p class="muted">Loading admit…</p>
  </div>
</div>

<div id="home-floor" style="grid-column: 1 / -1;"
     hx-get="/partials/home-floor"
     hx-trigger="load, every 2s"
     hx-swap="innerHTML">
  {% include "partials/home_floor.html" %}
</div>

<script src="/static/cockpit.js"></script>
{% endblock %}
